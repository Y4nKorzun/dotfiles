# ============================================
# Tmux Configuration - CachyOS Optimized
# ============================================

# Change prefix from Ctrl+B to Ctrl+A (easier to reach)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ============================================
# Basic Settings
# ============================================

# Enable mouse support (scroll, click, resize)
set -g mouse on

# Use vi mode for copy mode
setw -g mode-keys vi

# Scroll four times faster than tmux's 5-line default
bind -T root WheelUpPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M ; send-keys -M ; send-keys -M ; send-keys -M } { copy-mode -e ; send-keys -X -N 20 scroll-up }
bind -T root WheelDownPane if-shell -F "#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M ; send-keys -M ; send-keys -M ; send-keys -M }
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 20 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 20 scroll-down

# Start window and pane numbering at 1 (easier to reach)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase scrollback buffer size (50000 lines)
set -g history-limit 50000

# Faster key repetition
set -s escape-time 0

# Keep pane numbers visible for 3 seconds
set -g display-panes-time 3000

# Focus events enabled for terminals that support them
set -g focus-events on

# ============================================
# Better Splitting
# ============================================

# Split panes using | and - (more intuitive)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new windows in current directory
bind c new-window -c "#{pane_current_path}"

# ============================================
# Pane Navigation (Vim-style)
# ============================================

# Switch panes using Alt+arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Or use vim keys with prefix
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Choose a pane in this window with fzf, then Enter to focus it
bind w set-environment -F TMUX_PICKER_WINDOW '#{window_id}' \; display-popup -E -w 86% -h 70% -T " Panes — #W " "/Users/yankorzun/.config/zsh/tmux-pane-picker" \; set-environment -u TMUX_PICKER_WINDOW
unbind W
bind p previous-window
bind -n C-q display-panes

# Russian keyboard equivalents: р о л д map to h j k l
bind р select-pane -L
bind о select-pane -D
bind л select-pane -U
bind д select-pane -R

# Resize panes with prefix + arrow keys
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 5
bind -r Down resize-pane -D 5

# ============================================
# Window Management
# ============================================

# Switch windows with Shift+arrow (no prefix needed)
bind -n S-Left previous-window
bind -n S-Right next-window

# Move windows left/right
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# ============================================
# Copy Mode (Vi-style)
# ============================================

# Enter copy mode with prefix + [
bind [ copy-mode

# Send mouse selections to the macOS clipboard.
set -s copy-command "pbcopy"

# Use 'v' to start selection (like vim)
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Use 'y' to yank (copy to clipboard)
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Use 'r' for rectangle selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# ============================================
# Status Bar Styling
# ============================================

# Status bar position
set -g status-position bottom

# Update status bar every 5 seconds
set -g status-interval 5

# Status bar colors (match CachyOS/KDE theme)
set -g status-style bg=colour235,fg=colour250

# Left side: Session name
set -g status-left-length 40
set -g status-left "#[fg=colour232,bg=colour39,bold] #S #[fg=colour39,bg=colour235]"

# Right side: Date, time, and system info
set -g status-right-length 100
set -g status-right "#[fg=colour250] %Y-%m-%d %H:%M #[fg=colour232,bg=colour39] #H "

# Window status format
setw -g window-status-format "#[fg=colour250,bg=colour235] #I:#W "
setw -g window-status-current-format "#[fg=colour232,bg=colour39,bold] #I:#W "

# Pane borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39

# ============================================
# Activity Monitoring
# ============================================

# Monitor activity in windows
setw -g monitor-activity on
set -g visual-activity off

# Highlight active window
setw -g window-status-activity-style fg=colour226,bg=colour235

# ============================================
# Terminal Settings
# ============================================

# Set terminal colors
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",alacritty:RGB"

# ============================================
# Reload Config
# ============================================

# Reload config with prefix + r
bind r source-file ~/.tmux.conf \; display-message " Tmux config reloaded! "

# ============================================
# Session Management Shortcuts
# ============================================

# Quick session switching
bind -n C-s choose-session
bind -n C-f display-popup -E -w 70% -h 55% "tms"
bind s choose-session
bind f display-popup -E -w 70% -h 55% "tms"

# Kill session with prefix + X
bind X confirm-before -p "kill-session #S? (y/n)" kill-session

# ============================================
# Plugins (using TPM - Tmux Plugin Manager)
# ============================================

# Install TPM first:
# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

# List of plugins
