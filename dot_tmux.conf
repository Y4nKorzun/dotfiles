# set -g @plugin 'tmux-plugins/tmux-continuum'    # Auto-save sessions
# set -g @plugin 'tmux-plugins/tmux-yank'         # Better clipboard integration
# set -g @plugin 'tmux-plugins/tmux-copycat'      # Search in copy mode

# Initialize TPM (keep at bottom)
# run '~/.tmux/plugins/tpm/tpm'

# ============================================
# Help Message
# ============================================

# Show help with prefix + ?
bind ? display-message "\
Prefix: Ctrl+a | Split: | (horiz) - (vert) | Navigate: Alt+arrows | \
Resize: Prefix+arrows | Copy: [ then v/y | Reload: r | Sessions: s/f | \
Pane picker: w | Previous window: p | Next/Prev Window: Shift+arrows"

set -g extended-keys on
set -g extended-keys-format csi-u
